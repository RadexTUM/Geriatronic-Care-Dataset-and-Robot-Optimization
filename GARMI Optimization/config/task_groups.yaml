# Task groups of the study reported in the paper (81 trials, five functional
# categories).
#
# groups:
#   all_tasks           optimization split (55 trials); used by --global
#   <category>          optimization split of one functional category
#   heldout_all         held-out split (26 repeat trials); never used in a search
#   heldout_<category>  held-out split of one functional category
#
# repeat_groups:
#   Recordings that are divided between the two splits: one trial of each
#   group belongs to the optimization split (the force-equipped recording if
#   available), the other recordings form the held-out split. The grouping
#   follows the trial numbering of the original recording sessions (e.g. the
#   recordings 'chair2' and 'chair6' became clearing_floor_kin and
#   moving_chair_force), see the column "Trial name (old)" in
#   Trials_Description.xlsx. Trials that are not listed form a group of their
#   own. The repeat groups are used for the clustered bootstrap.
#
# Trials of the dataset that are not listed here were not part of the study.
# The browser tool (garmi-opt gui) can create additional groups.
groups:
  all_tasks:
    description: Optimization split, all functional categories (55 trials).
    tasks:
    - administering_medication_force
    - changing_underpad_force
    - combing_hair_AAN_force

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmi-optimization"
version = "1.0.0"
description = "Processing of the Geriatronics Interaction Dataset and task-based optimization of the arm mounts of the humanoid robot GARMI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Radecker", email = "philipp.radecker@tum.de" },
  { name = "Simone Nertinger", email = "simone.nertinger@tum.de" },
  { name = "Alexander König" },
]
keywords = [
  "assistive robotics",
  "elderly care",
  "humanoid robots",
  "kinematic design optimization",
  "bayesian optimization",
  "mujoco",
  "franka panda",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "plotly>=5.18",
  "mujoco>=3.2",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
garmi-opt = "garmi_optimization.cli:main"

[project.urls]
Repository = "https://github.com/RadexTUM/Geriatronic-Care-Dataset-and-Robot-Optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
